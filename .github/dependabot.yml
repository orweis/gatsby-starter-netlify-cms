# Dependabot version updates. Pull requests are opened for review; nothing is
# merged automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gatsby:
        patterns:
          - 'gatsby'
          - 'gatsby-*'
          - 'babel-preset-gatsby'
      decap:
        patterns:
          - 'decap-*'
          - 'gatsby-plugin-decap-cms'
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
