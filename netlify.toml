# Netlify build settings: https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  publish = "public"
  command = "npm run build"
  # Netlify Functions (see lambda/hello.js), served at /.netlify/functions/<name>
  functions = "lambda"

[build.environment]
  # Keep in sync with .nvmrc and "engines" in package.json.
  NODE_VERSION = "20"

# Security and caching headers are generated into public/_headers by
# gatsby-plugin-netlify (see gatsby-config.js).
